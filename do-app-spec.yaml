# DigitalOcean App Platform specification
# https://docs.digitalocean.com/products/app-platform/reference/app-spec/
name: course-builder-backend

region: nyc

services:
  - name: api
    dockerfile_path: .docker/Dockerfile
    source_dir: /
    http_port: 8000
    instance_count: 1
    instance_size_slug: professional-xs

    envs:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: SECRET_KEY
        type: SECRET
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        scope: RUN_TIME
        value: "${APP_URL}"
      - key: CORS_ALLOWED_ORIGINS
        scope: RUN_TIME
        value: "${CORS_ALLOWED_ORIGINS}"
      - key: DB_HOST
        scope: RUN_TIME
        value: "${db.HOSTNAME}"
      - key: DB_PORT
        scope: RUN_TIME
        value: "${db.PORT}"
      - key: DB_NAME
        scope: RUN_TIME
        value: "${db.DATABASE}"
      - key: DB_USER
        scope: RUN_TIME
        value: "${db.USERNAME}"
      - key: DB_PASSWORD
        scope: RUN_TIME
        value: "${db.PASSWORD}"
      - key: SIGNING_KEY
        type: SECRET
      - key: DJANGO_RUN_MIGRATIONS
        value: "1"
      - key: DJANGO_COLLECTSTATIC
        value: "1"
      - key: CELERY_BROKER_URL
        scope: RUN_TIME
        value: "${redis.DATABASE_URL}"
      - key: CELERY_RESULT_BACKEND
        scope: RUN_TIME
        value: "${redis.DATABASE_URL}"
      - key: FRONTEND_URL
        scope: RUN_TIME
        value: "${FRONTEND_URL}"
      - key: EMAIL_HOST
        scope: RUN_TIME
        value: "${EMAIL_HOST}"
      - key: EMAIL_PORT
        scope: RUN_TIME
        value: "${EMAIL_PORT}"
      - key: EMAIL_USE_TLS
        scope: RUN_TIME
        value: "${EMAIL_USE_TLS}"
      - key: EMAIL_HOST_USER
        scope: RUN_TIME
        value: "${EMAIL_HOST_USER}"
      - key: EMAIL_HOST_PASSWORD
        type: SECRET
      - key: DEFAULT_FROM_EMAIL
        scope: RUN_TIME
        value: "${DEFAULT_FROM_EMAIL}"

    health_check:
      http_path: /health/
      initial_delay_seconds: 30
      period_seconds: 15
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    run_command: gunicorn config.wsgi:application --config gunicorn.conf.py

databases:
  - name: db
    engine: PG
    size: db-s-dev-database
    num_nodes: 1

  - name: redis
    engine: REDIS
    size: db-s-dev-redis
    num_nodes: 1
