name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

# Cancel superseded runs on the same ref (don't waste minutes on stale commits).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────
  lint:
    name: Lint & format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.6.9
      - name: Ruff lint (gate)
        run: ruff check --output-format=github .
      - name: Ruff format check (informational)
        run: ruff format --check .
        continue-on-error: true

  # ────────────────────────────────────────────────────────────
  security:
    name: Security (gitleaks, bandit, pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan (gitleaks binary — informational until first triage)
        # The gitleaks-action requires a paid license on ORG repos; the binary is free.
        continue-on-error: true
        run: |
          VER=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gl.tgz
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          /tmp/gitleaks dir . --redact --no-banner
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install bandit==1.7.10 pip-audit==2.7.3
      - name: Bandit SAST (informational until first triage)
        run: bandit -r api config includes --severity-level medium --confidence-level medium
             --exclude '*/tests/*,*/migrations/*,*/test_*.py'
        continue-on-error: true
      - name: Dependency CVE audit (informational until first triage)
        run: pip-audit -r requirements.txt
        continue-on-error: true

  # ────────────────────────────────────────────────────────────
  test:
    name: Tests + integrity + contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # Throwaway values — real secrets live in the deploy platform, never here.
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: ci-dummy-secret-key-not-used-anywhere-real
      SIGNING_KEY: ci-dummy-signing-key-not-used-anywhere-real
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      # ...one dummy entry for EVERY env var settings read with config() and no default.
      # If settings crash on import in CI, you missed one — the error names it.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Migration drift check (no un-migrated model changes)
        run: python manage.py makemigrations --check --dry-run
      - name: Migrations apply cleanly from zero
        run: python manage.py migrate --noinput
      - name: OpenAPI contract validates
        run: python manage.py spectacular --file openapi-schema.yaml --validate
      - name: Run tests
        run: python manage.py test
      - name: Upload OpenAPI schema artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: openapi-schema.yaml
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────
  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (verify only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile
          push: false
          tags: course-builder-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
