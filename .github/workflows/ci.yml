name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

# Cancel superseded runs on the same ref (don't waste minutes on stale commits).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────
  lint:
    name: Lint & format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.6.9
      - name: Ruff lint (gate)
        run: ruff check --output-format=github .
      - name: Ruff format check (informational)
        run: ruff format --check .
        continue-on-error: true

  # ────────────────────────────────────────────────────────────
  security:
    name: Security (gitleaks, bandit, pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan (gitleaks binary — informational until first triage)
        # The gitleaks-action requires a paid license on ORG repos; the binary is free.
        continue-on-error: true
        run: |
          VER=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gl.tgz
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          /tmp/gitleaks dir . --redact --no-banner
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install bandit==1.7.10 pip-audit==2.7.3
      - name: Bandit SAST (informational until first triage)
        run: bandit -r api config includes --severity-level medium --confidence-level medium
             --exclude '*/tests/*,*/migrations/*,*/test_*.py'
        continue-on-error: true
      - name: Dependency CVE audit (informational until first triage)
        run: pip-audit -r requirements.txt
        continue-on-error: true

  # ────────────────────────────────────────────────────────────
  test:
    name: Tests + integrity + contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # Throwaway values — real secrets live in the deploy platform, never here.
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: ci-dummy-secret-key-not-used-anywhere-real
      SIGNING_KEY: ci-dummy-signing-key-not-used-anywhere-real
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      # Cache (backs DRF rate limiting) - same redis service, different DB index.
      # Must be "localhost", not "redis": this job runs directly on the runner,
      # not inside a container, so the service container is only reachable via
      # its published port on localhost, same reasoning as DB_HOST above.
      REDIS_URL: redis://localhost:6379/1
      # ...one dummy entry for EVERY env var settings read with config() and no default.
      # If settings crash on import in CI, you missed one — the error names it.
      # S3-compatible storage is mocked in tests, but imports require values.
      ACCESS_KEY_ID: ci-dummy-not-a-real-key
      ACCESS_SECRET_KEY: ci-dummy-not-a-real-secret
      BUCKET_NAME: ci-dummy-bucket
      BUCKET_URL: https://ci-dummy-bucket.example.com
      # Field-level encryption (shared/utils/encryption.py) — defaults to ""
      # so it won't crash `check`, but MFA's encrypt_field/decrypt_field calls
      # raise at runtime without a real Fernet key, so tests need one. Not a
      # real secret — generated fresh for this comment, thrown away.
      FIELD_ENCRYPTION_KEY: 6iYSAd8pRX8mSg1Uebfb7zGEvSEcjWDS8EwkefOjrsM=
      # Flutterwave Env Variables
      FLUTTERWAVE_CLIENT_ID: dummy--917c-4480-bfd7-5e53afa7cedb
      FLUTTERWAVE_CLIENT_SECRET: dummpy-hG4OaKaL2Izk6hKr3JeVWZ9z
      FLUTTERWAVE_ENCRYPTION_KEY: dummy-gR4Pr3IOmMMdYGSqNbupdRYXOIqNBUxrs=
      FLUTTERWAVE_BASE_URL: https://developersandbox-api.flutterwave.com
      FLUTTERWAVE_SECRET_HASH: dummy-fd5938f9974dc56069e65705248c5b9d19e83ec45a941c4f4f8
      # SISSL
      SISSL_BASE_URL: https://dummy_url.com
      SISSL_API_TOKEN: dummy-sissl-api-token
      #YouVerify
      YOUVERIFY_WEBHOOK_SECRET: dummy-secret-key
      YOUVERIFY_API_KEY: dummy-api-key
      YOUVERIFY_BASE_URL: https://api.sandbox.youverify.co 
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Migration drift check (no un-migrated model changes)
        run: python manage.py makemigrations --check --dry-run
      - name: Migrations apply cleanly from zero
        run: python manage.py migrate --noinput
      - name: OpenAPI contract validates
        run: python manage.py spectacular --file openapi-schema.yaml --validate
      - name: Run tests
        run: python manage.py test
      - name: Upload OpenAPI schema artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: openapi-schema.yaml
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────
  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (verify only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile
          push: false
          tags: course-builder-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────
  # Staging CD — folded into CI (not workflow_run) because the VPS deploy
  # must work while `main` is still the default branch and reserved for
  # prod. These two jobs only ever run on a PUSH to staging (never on
  # PRs), and only after every gate above has passed — `needs` makes a
  # red CI mean no image and no deploy ping.
  # Staging CD — folded into CI (not workflow_run) because the VPS deploy
  # must work while `main` is still the default branch and reserved for
  # prod. Dokploy builds the image itself from the repo (compose `build:`),
  # so there is no registry step: green CI just fires the deploy webhook
  # and the VPS pulls + rebuilds the staging branch.
  trigger-staging-redeploy:
    name: Trigger Dokploy redeploy (staging)
    needs: [lint, security, test, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Ping Dokploy deploy webhook
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_STAGING_DEPLOY_WEBHOOK }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::DOKPLOY_STAGING_DEPLOY_WEBHOOK secret is not set."
            exit 1
          fi
          for attempt in 1 2 3; do
            code=$(curl -s -o /tmp/dokploy_resp.txt -w "%{http_code}" \
              -X POST --max-time 30 \
              -H "Content-Type: application/json" \
              -H "X-GitHub-Event: push" \
              -d "{\"ref\":\"refs/heads/staging\",\"repository\":{\"full_name\":\"${REPO_FULL_NAME}\"}}" \
              "$WEBHOOK_URL") || code=000
            echo "attempt ${attempt}: HTTP ${code}"
            case "$code" in
              2*)
                echo "Dokploy redeploy triggered — staging will rebuild from the merged commit."
                exit 0
                ;;
            esac
            sleep 10
          done
          echo "::error::Dokploy webhook never accepted the trigger."
          cat /tmp/dokploy_resp.txt 2>/dev/null || true
          exit 1
