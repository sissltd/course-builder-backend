name: CD

# Deploys ONLY after the CI workflow succeeds on a push to staging/main, so a red
# CI means no deploy. Dormant until repo variable CD_ENABLED=true.
#
# IMPORTANT: `workflow_run` triggers only fire from the workflow file on the
# DEFAULT branch (main). cd.yml must be present on `main` for CD to run at all.

on:
  workflow_run:
    workflows: ["CI"]          # must match the `name:` in ci.yml EXACTLY
    types: [completed]
    branches: [staging, main]

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false    # never cancel a deploy mid-flight

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build → push to DigitalOcean Container Registry
    # Only on: CI passed + it was a push (merge), not a PR run + CD switched on.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      vars.CD_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      DOCR_REGISTRY: ${{ vars.DOCR_REGISTRY }}
      DOCR_REPOSITORY: ${{ vars.DOCR_REPOSITORY }}
      ENV_TAG: ${{ github.event.workflow_run.head_branch == 'main' && 'latest' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}   # the exact commit CI passed on

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DOCR
        run: doctl registry login --expiry-seconds 1200

      - uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile
          push: true
          tags: |
            ${{ env.DOCR_REGISTRY }}/${{ env.DOCR_REPOSITORY }}:${{ env.ENV_TAG }}
            ${{ env.DOCR_REGISTRY }}/${{ env.DOCR_REPOSITORY }}:${{ env.ENV_TAG }}-${{ env.HEAD_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (Trivy) — informational until triaged
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.DOCR_REGISTRY }}/${{ env.DOCR_REPOSITORY }}:${{ env.ENV_TAG }}-${{ env.HEAD_SHA }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"
