<!doctype html>
<html>
  <body style="font-family: Arial, sans-serif; color: #1a1a1a; margin: 0; padding: 24px; background: #f5f5f5;">
    <table role="presentation" style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 32px;">
      <tr>
        <td>
          <p style="margin: 0 0 16px;">Hi {{ first_name }},</p>
          <p style="margin: 0 0 24px;">A one-time confirmation code is required to withdraw {{ amount }} from your SoluDesks Course Creator Studio wallet:</p>
          <p style="text-align: center; margin: 0 0 24px;">
            <span style="background: #1a1a1a; color: #ffffff; padding: 14px 28px; border-radius: 6px; display: inline-block; font-weight: bold; font-size: 24px; letter-spacing: 4px;">{{ code }}</span>
          </p>
          <p style="margin: 0 0 8px; color: #555555;">This code expires in {{ expiry_minutes }} minutes.</p>
          <p style="margin: 24px 0 0; color: #999999; font-size: 12px;">If you didn't request this withdrawal, you can safely ignore this email.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
