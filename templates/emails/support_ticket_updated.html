<!doctype html>
<html>
  <body style="font-family: Arial, sans-serif; color: #1a1a1a; margin: 0; padding: 24px; background: #f5f5f5;">
    <table role="presentation" style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 32px;">
      <tr>
        <td>
          <p style="margin: 0 0 16px;">Hi {{ first_name }},</p>
          <p style="margin: 0 0 16px;">{{ update }}</p>
          {% if reply %}<p style="margin: 0 0 16px; padding: 12px 16px; background: #f5f5f5; border-radius: 6px; white-space: pre-line;">{{ reply }}</p>{% endif %}
          <p style="margin: 0 0 4px;"><strong>Subject:</strong> {{ ticket_title }}</p>
          <p style="margin: 0 0 16px; color: #666666; font-size: 13px;">Ticket ID: {{ ticket_id }}</p>
          <p style="margin: 24px 0 0; color: #999999; font-size: 12px;">You're receiving this email because you created a support ticket on SoluDesks Course Creator Studio.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
